

---
name: Echo Workflow
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
jobs:
  echo-job:
    runs-on: ubuntu-latest
    steps:
      - name: Echo Message
        run: echo "Hello, DevOps!"

      - name: Multi line step
        run: |
          pwd

      - name: Display GitHub Variables
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Ref: ${{ github.ref }}"
          echo "Run Number: ${{ github.run_number }}"

      - name: Use Secrets and Variables
        env:
          MY_VARIABLE: ${{ vars.MY_VARIABLE }}
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Variable: $MY_VARIABLE"
          if [ -n "$MY_SECRET" ]; then
            echo "Secret is configured"
          else
            echo "Secret is missing"
          fi

      - name: Runner and System Variables
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "HOME: $HOME"
          echo "USER: $USER"

      - name: Set Environment Variable
        run: echo "MY_VALUE=test123" >> $GITHUB_ENV

      - name: Use Environment Variable
        run: |
          echo "Value: $MY_VALUE"

      - name: Set Step Output
        id: step1
        run: |
          echo "message=Hello from step 1" >> $GITHUB_OUTPUT
          echo "timestamp=$(date)" >> $GITHUB_OUTPUT

      - name: Use Step Output
        run: |
          echo "Message: ${{ steps.step1.outputs.message }}"
          echo "Timestamp: ${{ steps.step1.outputs.timestamp }}"

  output-job:
    runs-on: ubuntu-latest
    outputs:
      job_message: ${{ steps.set-output.outputs.message }}
    steps:
      - name: Set Output
        id: set-output
        run: echo "message=Hello from job" >> $GITHUB_OUTPUT

  input-job:
    needs: output-job
    runs-on: ubuntu-latest
    steps:
      - name: Use Output
        run: |
          echo "${{ needs.output-job.outputs.job_message }}"

  commit-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Make Changes
        run: |
          echo "New content" >> workflow-output.txt
          git add workflow-output.txt
          git commit -m "Update workflow output [skip ci]" || echo "No changes to commit"
          git push origin HEAD
